<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外掛字幕播放器</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f6f4,#111);--ink:light-dark(#151515,#eee);--line:light-dark(#d8d8d4,#333);--acc:#e4002b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:900px;margin:auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
input[type=text]{flex:1 1 240px;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
button,label.btn{font-size:15px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:light-dark(#fff,#1c1c1c);color:inherit;cursor:pointer;display:inline-flex;align-items:center}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#player{position:absolute;inset:0;width:100%;height:100%}
#sub{position:absolute;left:4%;right:4%;bottom:8%;text-align:center;pointer-events:none;z-index:2}
#sub span{display:inline;background:rgba(0,0,0,.72);color:#fff;padding:2px 8px;border-radius:4px;line-height:1.6;font-size:var(--fs,18px);white-space:pre-wrap;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#stage.full{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;z-index:9}
#exit{display:none;position:absolute;top:8px;right:8px;z-index:3;min-height:36px;opacity:.7}
#stage.full #exit{display:inline-flex}
#msg{font-size:14px;opacity:.8;min-height:1.5em}
small{opacity:.7}
</style>
</head>
<body>
<main>
<h1>外掛字幕播放器</h1>
<div class="row">
  <input type="text" id="url" placeholder="貼上 YouTube 影片網址">
</div>
<div class="row">
  <label class="btn" for="file">選字幕檔 (.srt / .vtt)</label>
  <input type="file" id="file" accept=".srt,.vtt,text/plain" hidden>
  <button class="main" id="load">載入影片</button>
</div>
<div id="msg"></div>

<div id="stage">
  <div id="player"></div>
  <div id="sub"></div>
  <button id="exit">✕ 離開全螢幕</button>
</div>

<div class="row">
  <button id="full">全螢幕（保留字幕）</button>
  <button data-off="-0.5">字幕早 0.5 秒</button>
  <button data-off="0.5">字幕晚 0.5 秒</button>
  <span id="offv">位移 0.0 秒</span>
</div>
<div class="row">
  <button data-fs="-2">字小一點</button>
  <button data-fs="2">字大一點</button>
</div>
<p><small>請用這頁的「全螢幕」按鈕，不要用 YouTube 自己的全螢幕，否則字幕會被蓋住。手機建議轉橫向。</small></p>
</main>

<script>
{
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cues=[],offset=0,fs=+(store.get('fs')||18),player=null,apiReady=false,pending=null;

function toSec(t){const m=t.trim().replace(',','.').split(':');let s=0;for(const p of m)s=s*60+parseFloat(p);return s}
function parse(text){
  const out=[];
  text=text.replace(/\r/g,'').replace(/^﻿/,'');
  for(const block of text.split(/\n\s*\n/)){
    const lines=block.split('\n');
    const i=lines.findIndex(l=>l.includes('-->'));
    if(i<0)continue;
    const [a,b]=lines[i].split('-->');
    const body=lines.slice(i+1).join('\n').replace(/<[^>]+>/g,'').trim();
    if(body)out.push({s:toSec(a),e:toSec(b.trim().split(/\s+/)[0]),t:body});
  }
  return out.sort((x,y)=>x.s-y.s);
}
function vid(u){
  const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m?m[1]:(/^[\w-]{11}$/.test(u.trim())?u.trim():null);
}
function msg(t){$('#msg').textContent=t}
function setFs(){document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)}

let last='';
function tick(){
  if(player&&player.getCurrentTime){
    const t=player.getCurrentTime()-offset;
    const c=cues.filter(c=>t>=c.s&&t<=c.e).map(c=>c.t).join('\n');
    if(c!==last){last=c;const el=$('#sub');el.textContent='';if(c){const sp=document.createElement('span');sp.textContent=c;el.appendChild(sp)}}
  }
  requestAnimationFrame(tick);
}

function create(id){
  if(player){player.loadVideoById(id);return}
  player=new YT.Player('player',{videoId:id,width:'100%',height:'100%',
    playerVars:{playsinline:1,fs:0,rel:0,cc_load_policy:0,iv_load_policy:3,origin:location.origin},
    events:{onError:e=>msg('影片無法播放（錯誤 '+e.data+'）。可能是上傳者關閉了「允許嵌入」。')}});
}
window.onYouTubeIframeAPIReady=()=>{apiReady=true;if(pending){create(pending);pending=null}};

$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const text=await f.text();
  cues=parse(text);
  if(cues.length){store.set('subs',text);msg('已載入字幕：'+f.name+'（'+cues.length+' 句）')}
  else msg('讀不到字幕內容，請確認是 .srt 或 .vtt 檔，且編碼是 UTF-8。');
});
$('#load').addEventListener('click',()=>{
  const id=vid($('#url').value);
  if(!id){msg('網址看不懂，請貼完整的 YouTube 影片網址。');return}
  store.set('url',$('#url').value);
  if(!cues.length)msg('提醒：還沒選字幕檔。');
  apiReady?create(id):(pending=id);
});
document.querySelectorAll('[data-off]').forEach(b=>b.addEventListener('click',()=>{
  offset=Math.round((offset+ +b.dataset.off)*10)/10;
  $('#offv').textContent='位移 '+offset.toFixed(1)+' 秒';
}));
document.querySelectorAll('[data-fs]').forEach(b=>b.addEventListener('click',()=>{fs=Math.max(10,Math.min(48,fs+ +b.dataset.fs));setFs()}));

const stage=$('#stage');
function enterFull(){
  stage.classList.add('full');
  const r=stage.requestFullscreen||stage.webkitRequestFullscreen;
  if(r){try{const p=r.call(stage);p&&p.catch&&p.catch(()=>{})}catch(e){}}
  try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
}
function exitFull(){
  stage.classList.remove('full');
  if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}
}
$('#full').addEventListener('click',enterFull);
$('#exit').addEventListener('click',exitFull);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)stage.classList.remove('full')});

// 還原上次的網址和字幕
const u=store.get('url');if(u)$('#url').value=u;
const s=store.get('subs');if(s){cues=parse(s);if(cues.length)msg('已還原上次的字幕（'+cues.length+' 句）。')}
setFs();
requestAnimationFrame(tick);

const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
}
</script>
</body>
</html>
